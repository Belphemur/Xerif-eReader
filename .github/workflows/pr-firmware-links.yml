name: PR firmware links

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  pull-requests: write

jobs:
  update-comment:
    if: github.event.workflow_run.event == 'pull_request'
    concurrency:
      group: pr-firmware-links-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Update firmware links comment
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- pr-firmware-artifacts -->';
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            const headOwner = run.head_repository?.owner?.login;
            if (!headOwner) {
              core.notice(`No head repository found for ${run.head_sha}.`);
              return;
            }

            const { data: pullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${headOwner}:${run.head_branch}`,
              state: 'all',
              per_page: 100,
            });
            const associatedPullRequest = pullRequests.find(
              (pr) => pr.state === 'open' && pr.head.sha === run.head_sha,
            );

            if (!associatedPullRequest) {
              core.notice(`No pull request found for ${run.head_sha}.`);
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: associatedPullRequest.number,
            });

            if (pullRequest.state !== 'open' || pullRequest.head.sha !== run.head_sha) {
              core.notice(`Skipping closed or superseded workflow run for ${run.head_sha}.`);
              return;
            }

            const builds = [
              { name: 'firmware.bin', device: 'X3 / X4' },
              { name: 'firmware-sticky.bin', device: 'Sticky' },
              { name: 'firmware-x4pro.bin', device: 'X4 Pro' },
              { name: 'firmware-x4c.bin', device: 'X4 Classic' },
              { name: 'firmware-papermono.bin', device: 'Paper Mono' },
              { name: 'firmware-metalio_eink4.bin', device: 'MetalIO EInk4' },
              { name: 'firmware-eego_a4.bin', device: 'EEGO A4' },
              { name: 'firmware-picco.bin', device: 'BOOX Picco' },
            ];
            const { data: artifactResponse } =
              await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
            const artifacts = new Map(
              artifactResponse.artifacts
                .filter((artifact) => !artifact.expired)
                .map((artifact) => [artifact.name, artifact]),
            );
            const missingBuilds = builds.filter((build) => !artifacts.has(build.name));
            const shortSha = run.head_sha.slice(0, 7);
            let body = `${marker}\n### Firmware builds\n\n`;

            if (missingBuilds.length === 0) {
              const links = builds.map(({ name, device }) => {
                const artifact = artifacts.get(name);
                const url = `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts/${artifact.id}`;
                return `- [${device} (\`${name}\`)](${url})`;
              });
              body += `Automatically generated for the latest commit of this PR (\`${shortSha}\`).\n\n`;
              body += `${links.join('\n')}\n\n`;
              body += 'Download the file for your device, extract the `.bin` from the ZIP, then flash it with ';
              body += '[CrossPoint Reader Flash Tools](https://crosspointreader.com/#flash-tools). ';
              body += '**Make sure you use the correct firmware file for your device.**';
              body += '\n\n> Artifacts are deleted 7 days after upload. If a link is dead, ask for a fresh build — any new commit on this PR regenerates this comment.';

              if (run.conclusion !== 'success') {
                body += `\n\n> The firmware builds succeeded, but [another CI check finished with ${run.conclusion}](${run.html_url}).`;
              }
            } else {
              const missingNames = missingBuilds.map(({ name }) => `\`${name}\``).join(', ');
              body += `Firmware is not available for the latest commit of this PR (\`${shortSha}\`). `;
              body += `The build did not produce ${missingNames}. [View the CI run](${run.html_url}).`;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const existingComment = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullRequest.number,
                body,
              });
            }

  # PR firmware publish lane (design docs/design/2026-11-08-dev-ota-pr-firmware.md):
  # after the comment job updates the artifact links, this run's x4pro build is
  # uploaded to the rolling `dev` prerelease and manifest.json is republished.
  # Bot-authored PRs skip silently (D2: no asset upload, no manifest write).
  publish-pr-firmware:
    needs: update-comment
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    concurrency:
      # Shared repo-wide publication lane (D6): publishers wait on each other;
      # the PR delete lane (pr-dev-cleanup.yml) is what cancels in progress.
      group: dev-release-manifest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Resolve the pull request and apply the bot filter
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            const headOwner = run.head_repository?.owner?.login;
            if (!headOwner) return;

            const { data: pullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${headOwner}:${run.head_branch}`,
              state: 'open',
              per_page: 100,
            });
            const associatedPullRequest = pullRequests.find(
              (pr) => pr.head.sha === run.head_sha,
            );
            if (!associatedPullRequest) return;

            // D2: an author login containing "bot" (case-insensitive) skips
            // the publish lane silently — no asset, no manifest change.
            const author = (associatedPullRequest.user?.login || '').toLowerCase();
            if (author.includes('bot')) return;

            core.setOutput('publish', 'true');
            core.setOutput('pr_number', String(associatedPullRequest.number));
            core.setOutput('short_sha', run.head_sha.slice(0, 7));

      - uses: actions/checkout@v7
        if: steps.gate.outputs.publish == 'true'
        with:
          persist-credentials: false

      - name: Fetch the PR head commit (the stamp derivation needs the object)
        if: steps.gate.outputs.publish == 'true'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          # The checkout is a depth-1 snapshot of develop, so the PR head
          # commit's object is absent and git_branch.py's existence-checked
          # rev-parse would fail. Fetch it — origin first, the head
          # repository for fork PRs; if both fail the asset publishes
          # unstamped (the device falls back to the asset name).
          git fetch origin "${HEAD_SHA}" \
            || git fetch "https://github.com/${HEAD_REPO}.git" "${HEAD_SHA}" \
            || echo "::warning::PR head commit ${HEAD_SHA} unreachable; the asset will publish unstamped"

      - name: Stage the previous manifest for sha256 reuse
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p carry
          gh release download dev --repo "$GITHUB_REPOSITORY" --dir carry \
            --pattern 'manifest.json' --clobber \
            || echo "no prior manifest.json on the dev release"

      - name: Download the x4pro firmware artifact
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ github.event.workflow_run.id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name firmware-x4pro.bin \
            --dir artifact

      - name: Upload PR firmware, then regenerate and upload the manifest last
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          SHORT_SHA: ${{ steps.gate.outputs.short_sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          asset="xerif-pr-${PR_NUMBER}-${SHORT_SHA}-x4pro.bin"
          mv artifact/firmware.bin "${asset}"
          # Stamp the PR version into the image's esp_app_desc_t (design
          # docs/design/2026-11-07-dev-ota-slots.md §14): PR firmware
          # installs through the same dev picker, so it is stamped like a
          # develop build. The FULL head sha feeds the derivation (the
          # 7-char SHORT_SHA in the asset name would not re-shorten
          # identically); --branch overrides the checkout's develop branch
          # with the PR head branch. On a derivation failure the asset
          # publishes unstamped — the device falls back to the asset name.
          if pr_version="$(python3 scripts/git_branch.py --print-dev-version \
              "${HEAD_SHA}" --branch "${HEAD_BRANCH}" 2>&1)"; then
            python3 scripts/patch_dev_version.py --image "${asset}" --version "${pr_version}"
            python3 scripts/patch_dev_version.py --image "${asset}" --verify
          else
            echo "::warning::could not derive the PR dev version; publishing unstamped"
            echo "${pr_version}"
          fi
          # Same publish gate as the dev channel: the PR asset must pass the
          # full image verifier before it may reach the rolling release.
          python3 scripts/patch_dev_version.py --image "${asset}" --validate

          if ! gh release view dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create dev \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Dev builds (rolling)" \
              --notes "Rolling dev channel: the newest x4pro builds from develop and open pull requests. Install from Settings > Dev channel on a dev build; unsigned manifest, SHA-256 pinned."
          fi

          # Atomic-publish invariant (D7): the asset goes up first; the
          # manifest is then regenerated from the release's actual assets and
          # uploaded last, so a failed manifest upload leaves the previous
          # manifest live.
          gh release upload dev --repo "$GITHUB_REPOSITORY" --clobber "${asset}"
          python3 .github/workflows/generate_dev_manifest.py \
            --out manifest.json \
            --prior carry/manifest.json \
            --local . \
            --pr-new "${asset}" \
            --pr-branch "${HEAD_BRANCH}"
          gh release upload dev --repo "$GITHUB_REPOSITORY" --clobber manifest.json
