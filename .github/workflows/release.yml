name: Compile Release

# Builds every board's release firmware on tag push and publishes each .bin
# under BOTH names during the OTA asset-name transition:
#   xpoint-<version>-<device>.bin        (compatibility name for pre-rename OTA)
#   xerif-<version>-<device>.bin         (current name)
# (the combined C3 X4/X3 binary uses device tag x3-x4). It then creates a draft
# GitHub Release, attaches all build artifacts, and generates + signs a per-board
# manifest.json (Ed25519) so the device can verify OTA authenticity.
#
# Easy OTA trigger:
#   1. Bump the version in platformio.ini (crosspoint.version) and commit to develop.
#   2. Push a tag:  git tag -s v1.2.3 -m "Release v1.2.3" && git push origin v1.2.3
#      (any tag triggers this workflow). The release is created as a DRAFT — publish it
#      from the GitHub UI (or set make_latest / draft:false below) and devices will see it.
#
# Signing: the Ed25519 private key lives in the repo secret OTA_SIGNING_KEY (raw 32-byte
# seed, base64). The matching public key is baked into the firmware at lib/OtaSignature/
# ota_pubkey.h. Rotate both together (see docs/OTA_SIGNING.md).

on:
  push:
    tags:
      - '*'

# Cap the PlatformIO Core version the platform's penv bootstrap may install
# (see .github/pio-constraints.txt). UV_CONSTRAINT reaches the penv's uv pip
# install; PIP_CONSTRAINT covers the pip fallback path.
env:
  UV_CONSTRAINT: ${{ github.workspace }}/.github/pio-constraints.txt
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/pio-constraints.txt

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: gh_release
            device: x3-x4
          - pio_env: sticky-gh_release
            device: sticky
          - pio_env: x4pro-gh_release
            device: x4pro
          - pio_env: papermono-gh_release
            device: papermono
          - pio_env: x4c-gh_release
            device: x4c
          - pio_env: metalio_eink4-gh_release
            device: metalio_eink4
          - pio_env: eego_a4-gh_release
            device: eego_a4
          - pio_env: picco-gh_release
            device: picco
          # picco release-CANDIDATE builds live in release_candidate.yml (which carries a proper pio_env); the legacy release_env/rc_env-only entry here lacked pio_env and broke the release build with UnknownEnvNamesError.
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          configured_version="$(sed -n 's/^version = //p' platformio.ini | head -n1)"
          test "$version" = "$configured_version"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.2.0.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.pio_env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.pio_env }}-
            pio-${{ runner.os }}-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # The hybrid envs (gh_release/x3-x4 dual-family, sticky) run a nested
          # `pio run` from ~/.platformio/penv after the IDF phase (espidf.py:
          # "Starting Arduino compile ... with custom libraries"). The platform
          # bootstraps that penv mid-build with an open-ended "pioarduino>=6.2.0"
          # resolved from PyPI. Since pioarduino published 6.2.0.post1 (after
          # v2.11.0), PyPI's latest maps through pepver_to_semver to the
          # prerelease 6.2.0-post.1, which fails the platform manifest's
          # engines check (platform.json requires core >=6.2.0) — the nested
          # pio died with IncompatiblePlatform right after "Copied compiled
          # IDF libraries" in the v2.12.0 release build. Same failure class as
          # the RC workflow's SCons pin (see that step and
          # pioarduino/platform-espressif32#529). Trigger the penv bootstrap
          # cheaply here, then pin the penv core to the same 6.2.0 the outer
          # core runs; penv_setup's dependency check then sees 6.2.0 already
          # satisfying >=6.2.0 and leaves it alone.
          pio pkg install -e ${{ matrix.pio_env }}
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.2.0"
          ~/.platformio/penv/bin/pio --version

      - name: Build CrossPoint
        env:
          # Enrollment gate for the LCP service: official releases carry this
          # key, self-builds do not (and lose only LCP). Rotate per release by
          # updating the repo secret; retire old values in the service's
          # RELEASE_KEYS list.
          FREEINK_LCP_RELEASE_KEY: ${{ secrets.FREEINK_LCP_RELEASE_KEY }}
        run: |
          if [ -n "$FREEINK_LCP_RELEASE_KEY" ]; then
            export PLATFORMIO_BUILD_FLAGS="-DFREEINK_LCP_RELEASE_KEY=\\\"$FREEINK_LCP_RELEASE_KEY\\\""
          fi
          pio run -e ${{ matrix.pio_env }} -j1

      - name: Prepare firmware assets
        id: asset
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          xpoint_asset="xpoint-${version}-${{ matrix.device }}.bin"
          xerif_asset="xerif-${version}-${{ matrix.device }}.bin"
          cp ".pio/build/${{ matrix.pio_env }}/firmware.bin" \
            ".pio/build/${{ matrix.pio_env }}/${xpoint_asset}"
          cp ".pio/build/${{ matrix.pio_env }}/firmware.bin" \
            ".pio/build/${{ matrix.pio_env }}/${xerif_asset}"
          echo "xpoint_name=$xpoint_asset" >> "$GITHUB_OUTPUT"
          echo "xerif_name=$xerif_asset" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.asset.outputs.xerif_name }}
          path: |
            .pio/build/${{ matrix.pio_env }}/bootloader.bin
            .pio/build/${{ matrix.pio_env }}/${{ steps.asset.outputs.xpoint_name }}
            .pio/build/${{ matrix.pio_env }}/${{ steps.asset.outputs.xerif_name }}
            .pio/build/${{ matrix.pio_env }}/firmware.elf
            .pio/build/${{ matrix.pio_env }}/firmware.map
            .pio/build/${{ matrix.pio_env }}/partitions.bin

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job creates the release + attaches assets
    steps:
      - name: Checkout repo
        # publish-release needs a .git so `gh release create` can resolve the
        # repo/branch; download-artifact alone leaves no working tree.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release assets
        id: collect
        run: |
          mkdir -p dist
          # Each artifact carries one xpoint-*.bin and one identical
          # xerif-*.bin. Search for actual *files* recursively and never match a
          # directory (a directory match made `cp` fail with "omitting directory").
          for d in artifacts/*/; do
            while IFS= read -r bin; do
              cp "$bin" "dist/$(basename "$bin")"
            done < <(find "$d" -type f \( -name 'xpoint-*.bin' -o -name 'xerif-*.bin' \))
          done
          # Upstream parity check (hand-ported from the Picco sync): every device
          # in the matrix must have produced its xerif asset before a release is
          # cut — a silently missing device would otherwise ship half a release.
          version="${GITHUB_REF_NAME#v}"
          for device in x3-x4 sticky x4pro x4c papermono metalio_eink4 eego_a4 picco; do
            test -f "dist/xerif-${version}-${device}.bin"
          done
          test "$(find dist -maxdepth 1 -type f -name 'xerif-*.bin' | wc -l)" -eq 8
          ls -la dist
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate + sign manifest
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          # Deployed firmware aborts the manifest fetch above MAX_MANIFEST_BYTES
          # (src/network/OtaUpdater.cpp). Derive the gate below from the source
          # so the firmware stays the single source of truth for the cap.
          OTA_CAP=$(grep -oP 'MAX_MANIFEST_BYTES\s*=\s*\K[0-9]+' src/network/OtaUpdater.cpp | head -1)
          export OTA_CAP
          python3 - <<'PY'
          import base64, hashlib, json, os, glob, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          dist = "dist"
          # Asset device tag -> manifest board name (matches FirmwareBoardTag.cpp).
          # The combined C3 X4/X3 image is one compatibility class, tagged x4.
          device_board = {
              "x3-x4": "x4",
              "sticky": "sticky",
              "x4pro": "x4pro",
              "papermono": "papermono",
              "x4c": "x4c",
              "metalio_eink4": "metalio_eink4",
              "eego_a4": "eego_a4",
              "picco": "picco",
          }
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          # Sign both asset families. Xpoint entries MUST come first:
          # pre-rename devices (v1.16..v2.10) select the manifest entry whose
          # URL matches the xpoint asset they found in the release JSON, and
          # older cap-8 parsers return the first board match they encounter.
          # Xerif devices select the entry whose URL matches the xerif asset.
          families = (
              ("xpoint", f"xpoint-{version}-"),
              ("xerif", f"xerif-{version}-"),
          )
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          boards = []
          for family, prefix in families:
              for path in sorted(glob.glob(os.path.join(dist, f"{family}-*.bin"))):
                  name = os.path.basename(path)
                  device = name[len(prefix):-len(".bin")]
                  board = device_board.get(device)
                  if not board:
                      print(f"skip {name}: unknown device tag", file=sys.stderr)
                      continue
                  with open(path, "rb") as f:
                      data = f.read()
                  sha = hashlib.sha256(data).hexdigest()
                  # Resolve the published asset URL on the (draft) release.
                  url = f"https://github.com/{repo}/releases/download/{tag}/{name}"
                  boards.append({
                      "board": board,
                      "url": url,
                      "size": len(data),
                      "sha256": sha,
                  })
          manifest = {
              "version": version,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "boards": boards,
          }
          # Compact separators, not indent=2: the manifest must fit inside the
          # firmware's OTA fetch cap (asserted below against OTA_CAP). The
          # pretty form measured 4163 bytes for 16 entries — over the 4096 cap —
          # once the repo rename lengthened every asset URL; compact is ~3475.
          text = json.dumps(manifest, separators=(",", ":"), sort_keys=True)
          # Sign the EXACT bytes we write to disk. The device verifies the
          # downloaded file body, so the signature must cover the same bytes
          # (including the trailing newline) or verification fails.
          body = text + "\n"
          cap = int(os.environ["OTA_CAP"])
          if len(body.encode("utf-8")) > cap:
              raise SystemExit(
                  f"manifest.json is {len(body.encode('utf-8'))} bytes, over the "
                  f"{cap}-byte OTA fetch cap (OtaUpdater.cpp MAX_MANIFEST_BYTES). "
                  "Shrink the manifest or coordinate a firmware cap bump first."
              )
          with open(os.path.join(dist, "manifest.json"), "w") as f:
              f.write(body)

          # Sign the exact manifest bytes with the Ed25519 private key (raw 32-byte seed).
          raw = base64.b64decode(os.environ["OTA_SIGNING_KEY"])
          key = Ed25519PrivateKey.from_private_bytes(raw)
          sig = key.sign(body.encode("utf-8"))
          with open(os.path.join(dist, "manifest.json.sig"), "wb") as f:
              f.write(base64.b64encode(sig))
          print("manifest signed for", len(boards), "boards")
          PY

      - name: Generate release notes
        run: |
          set -euo pipefail
          # Previous tag = closest tag reachable from the release tag's parent
          # commit. `git describe --abbrev=0 <ref>^` only walks REACHABLE tags,
          # so the stray ancient pre-OTA tags (e.g. 1.6.0rc, not ancestors of
          # develop) can never be picked as the changelog base.
          prev_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          notes=dist/NOTES.md
          {
            echo "Personal fork release. See README fork notice. OTA is signed (Ed25519); verify before flashing."
          } > "$notes"
          if [ -n "$prev_tag" ]; then
            echo "" >> "$notes"
            python3 scripts/generate_changelog.py "${prev_tag}..${GITHUB_REF_NAME}" --pr-links >> "$notes"
            echo "notes range: ${prev_tag}..${GITHUB_REF_NAME}"
          else
            echo "notes: no previous tag reachable; keeping static notice only"
          fi
          cat "$notes"

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a DRAFT release so a human reviews assets before going live.
          # Flip `--draft` to `--latest` (or add `--latest`) to auto-publish.
          gh release create "${{ steps.collect.outputs.tag }}" \
            --draft \
            --title "Xerif ${{ steps.collect.outputs.tag }}" \
            --notes-file dist/NOTES.md \
            dist/xpoint-*.bin dist/xerif-*.bin \
            dist/manifest.json dist/manifest.json.sig
