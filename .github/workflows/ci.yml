name: CI

# CI for the CrossPoint Reader firmware + host unit tests, and for the
# website (docs + web flasher) under website/.
# Runs on the integration branches (develop, feat/ttf-support), master, and every PR.
# Content-aware: the `changes` job classifies the PR diff, firmware jobs run
# only for firmware changes, the website build runs only for website changes.
# The `ci` job at the bottom is the single required status check (merge gate).

on:
  push:
    branches: [develop, master, feat/ttf-support]
  pull_request:
  workflow_dispatch:

# Keep the PlatformIO Core version the platform's penv bootstrap installs in
# sync with the core pinned in "Install PlatformIO Core" (v6.2.0). platform.json
# declares tool-scons 4.41101.0; a core/tool-scons mismatch gets wiped mid-build
# (pioarduino/platform-espressif32#529). The constraint caps both the system
# install and the penv's uv pip install.
env:
  UV_CONSTRAINT: ${{ github.workspace }}/.github/pio-constraints.txt
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/pio-constraints.txt

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Classify the PR diff. Firmware is the conservative default: anything
  # outside website/ (including .github/ and root files) counts as firmware.
  # On non-PR triggers (push, dispatch) everything runs.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.classify.outputs.website }}
      firmware: ${{ steps.classify.outputs.firmware }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify touched paths
        id: classify
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "website=true" >> "$GITHUB_OUTPUT"
            echo "firmware=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR trigger: running everything."
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if git cat-file -e "$BASE" 2>/dev/null; then
            WEBSITE_TOUCHED=$(git diff --name-only "$BASE" "$HEAD" -- website/ | wc -l)
            ALL_TOUCHED=$(git diff --name-only "$BASE" "$HEAD" | wc -l)
          else
            # Force-pushed base outside fetch window: everything, conservatively.
            echo "Base $BASE not present; assuming both touched."
            echo "website=true" >> "$GITHUB_OUTPUT"
            echo "firmware=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$ALL_TOUCHED" -eq 0 ]]; then
            # Empty diff (e.g. same commit as base): run everything.
            echo "website=true" >> "$GITHUB_OUTPUT"
            echo "firmware=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$WEBSITE_TOUCHED" -eq "$ALL_TOUCHED" ]]; then
            echo "website-only PR ($ALL_TOUCHED files): firmware jobs will be skipped."
            echo "website=true"  >> "$GITHUB_OUTPUT"
            echo "firmware=false" >> "$GITHUB_OUTPUT"
          else
            echo "Mixed/firmware PR ($ALL_TOUCHED files, $WEBSITE_TOUCHED under website/): running both."
            echo "website=true"  >> "$GITHUB_OUTPUT"
            echo "firmware=true"  >> "$GITHUB_OUTPUT"
          fi

  clang-format:
    name: clang-format
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    name: cppcheck
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    # The pinned platformio/tool-cppcheck@~1.22200.0 (cppcheck 2.22) has no
    # PCRE1 dependency, so the standard ubuntu-latest (26.x) image works
    # again. The install step also syncs the tool's package.json version to
    # the platform manifest's package-version (bin/cppcheck-tool-sync) —
    # without it pioarduino's platform wipes any non-pioarduino tool-cppcheck
    # during the check's idedata configure and the check dies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.2.0.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          # pio-v4: cache regenerated with tool-cppcheck 2.22 (PCRE-free).
          key: pio-v4-${{ runner.os }}-cppcheck-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}
          restore-keys: |
            pio-v4-${{ runner.os }}-cppcheck-

      - name: Install tool-cppcheck
        run: |
          # PlatformIO Core does not install the check tool itself; the old
          # 2.20.1 binary (via the cache) needed libpcre.so.3, which Ubuntu
          # 26.x no longer ships. Pin the registry's latest 2.22 build, which
          # links only against libc/libstdc++, and sync its package.json
          # version so the platform's tool check does not wipe it mid-check
          # (mechanism documented in bin/cppcheck-tool-sync).
          ./bin/cppcheck-tool-sync

      - name: Cache cppcheck analysis results
        # Incremental-analysis cache (see --cppcheck-build-dir in
        # platformio.ini [base].check_flags). cppcheck keys entries on file
        # CONTENT hashes, so results survive fresh checkouts and unchanged
        # translation units are not re-analysed. Key includes the checked
        # sources and the tool-sync pin so a source or cppcheck bump starts
        # from a clean cache instead of a partial one.
        uses: actions/cache@v6
        with:
          path: .cppcheck-build
          key: cppcheck-build-v1-${{ runner.os }}-${{ hashFiles('platformio.ini', 'bin/cppcheck-tool-sync', 'src/**', 'lib/**') }}
          restore-keys: |
            cppcheck-build-v1-${{ runner.os }}-

      - name: Report cppcheck version
        # Informational only: prove in the CI log that the resolved tool is
        # the PCRE-free 2.22 build, not a stale cached 2.20 binary.
        run: |
          bin="${HOME}/.platformio/packages/tool-cppcheck/cppcheck"
          if [[ -x "${bin}" ]]; then
            "${bin}" --version
          else
            find "${HOME}/.platformio/packages/tool-cppcheck" -maxdepth 1 -type f -name 'cppcheck*' -print || true
          fi

      - name: Run cppcheck
        # cppcheck requires --cppcheck-build-dir's directory to exist; create
        # it (possibly restored empty/partial by the cache step) before the run.
        run: mkdir -p .cppcheck-build && pio check -e cppcheck --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  build:
    name: Build ${{ matrix.env }}
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Short board-specific names keep pull-request artifacts easy to identify.
        # The release workflow publishes xerif-<version>-<device>.bin.
        include:
          - env: default
            asset: firmware.bin
          - env: sticky
            asset: firmware-sticky.bin
          - env: x4pro
            asset: firmware-x4pro.bin
          - env: x4c
            asset: firmware-x4c.bin
          - env: papermono
            asset: firmware-papermono.bin
          - env: metalio_eink4
            asset: firmware-metalio_eink4.bin
          - env: eego_a4
            asset: firmware-eego_a4.bin
          - env: picco
            asset: firmware-picco.bin
          - env: onepage
            asset: firmware-onepage.bin
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.2.0.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-v3-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}
          restore-keys: |
            pio-v3-${{ runner.os }}-${{ matrix.env }}-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # Envs with custom_sdkconfig (default, sticky) run a nested `pio run` from
          # ~/.platformio/penv. The platform bootstraps that penv with an open-ended
          # "pioarduino>=6.1.19", which drifts upward independently of the outer
          # core; a penv core whose tool-scons pin disagrees with the platform's
          # makes them reinstall over each other until the running SCons loses its
          # package mid-build ("No module named 'SCons.Tool.FortranCommon'").
          # Keep the penv core on the same 6.2.0 version as the outer core
          # installed above (the develop platform needs 6.2.0 / SCons 4.11.1 --
          # upstream's 55.03.311 wants 6.1.19, hence the different pin).
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e ${{ matrix.env }}
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.2.0"
          ~/.platformio/penv/bin/pio --version

      - name: Build ${{ matrix.env }} firmware
        env:
          # The checkout is detached (actions/checkout pins GITHUB_SHA), so
          # git_branch.py cannot name the branch from the checkout alone and
          # must never stamp a "detached" label into the compiled
          # CROSSPOINT_VERSION (About screen, crash reports, OTA compare).
          # pull_request runs carry the head branch; push runs the branch.
          CROSSPOINT_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          pio run -e ${{ matrix.env }} | tee pio.log

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
          if-no-files-found: error
          # Test builds only — the per-PR firmware-links comment is the
          # delivery path; keep storage bounded.
          retention-days: 7

      - name: Extract firmware stats
        id: stats
        continue-on-error: true
        env:
          STATS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            BASE_SHA="$(git rev-parse HEAD^1)"
          fi
          python3 .github/scripts/firmware-stats.py pio.log "${{ matrix.env }}" "$STATS_SHA" \
            ".pio/build/${{ matrix.env }}/firmware.bin" "$BASE_SHA" > firmware-stats.json
          {
            echo '## ${{ matrix.env }} firmware build stats'
            echo '```json'
            cat firmware-stats.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware stats
        if: steps.stats.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: firmware-stats-${{ matrix.env }}
          path: firmware-stats.json
          if-no-files-found: error

  unit-tests:
    name: Host unit tests
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Test firmware comment and measurements
        run: |
          python3 -m unittest discover -s test -p test_firmware_stats.py
          node --test test/firmware_comment.test.js

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev

      - name: Cache googletest source (FetchContent)
        uses: actions/cache@v6
        with:
          path: build/test/_deps
          # Include the repo name so a rename/fork (which changes the runner
          # checkout path baked into CMakeCache.txt) busts the stale cache
          # instead of restoring a pre-rename one with wrong absolute paths.
          key: ${{ runner.os }}-gtest-${{ github.event.repository.name }}-${{ hashFiles('test/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-gtest-${{ github.event.repository.name }}-

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j"$(nproc)"

  website:
    name: Website build
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            website/node_modules
          key: website-bun-${{ runner.os }}-${{ hashFiles('website/bun.lock') }}
          restore-keys: |
            website-bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site (production)
        env:
          # Raises the GitHub releases API rate limit for the build-time
          # changelog/manifest generation (lib/releases.mjs).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx --bun vitepress build

      - name: Sanity-check build output
        run: |
          set -euo pipefail
          dist=".vitepress/dist"
          for page in index.html flash.html changelog.html 404.html; do
            test -s "$dist/$page" || { echo "MISSING: $dist/$page"; exit 1; }
          done
          pages=$(find "$dist" -name '*.html' | wc -l)
          manifests=$(find "$dist" -maxdepth 1 -name 'xerif-manifest-*.json' | wc -l)
          echo "pages=$pages manifests=$manifests"
          test "$pages" -ge 20
          echo "Website build gate passed."

  # This job is the single PR required status check (the merge gate). It allows
  # changing the individual jobs above in the future without reconfiguring
  # branch protection. Content-aware: website-only PRs skip the firmware jobs,
  # firmware-only PRs skip the website build; skipped jobs do not block.
  ci:
    name: CI Status
    needs:
      - changes
      - build
      - clang-format
      - cppcheck
      - unit-tests
      - website
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
