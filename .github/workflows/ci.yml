name: CI

# CI for the CrossPoint Reader firmware + host unit tests.
# Runs on the integration branches (develop, feat/ttf-support), master, and every PR.
# The `ci` job at the bottom is the single required status check.

on:
  push:
    branches: [develop, master, feat/ttf-support]
  pull_request:
  workflow_dispatch:

# Keep the PlatformIO Core version the platform's penv bootstrap installs in
# sync with the core pinned in "Install PlatformIO Core" (v6.2.0). platform.json
# declares tool-scons 4.41101.0; a core/tool-scons mismatch gets wiped mid-build
# (pioarduino/platform-espressif32#529). The constraint caps both the system
# install and the penv's uv pip install.
env:
  UV_CONSTRAINT: ${{ github.workspace }}/.github/pio-constraints.txt
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/pio-constraints.txt

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    name: cppcheck
    # The pinned platformio/tool-cppcheck@~1.22200.0 (cppcheck 2.22) has no
    # PCRE1 dependency, so the standard ubuntu-latest (26.x) image works
    # again. The install step also syncs the tool's package.json version to
    # the platform manifest's package-version (bin/cppcheck-tool-sync) —
    # without it pioarduino's platform wipes any non-pioarduino tool-cppcheck
    # during the check's idedata configure and the check dies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.2.0.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          # pio-v4: cache regenerated with tool-cppcheck 2.22 (PCRE-free).
          key: pio-v4-${{ runner.os }}-cppcheck-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}
          restore-keys: |
            pio-v4-${{ runner.os }}-cppcheck-

      - name: Install tool-cppcheck
        run: |
          # PlatformIO Core does not install the check tool itself; the old
          # 2.20.1 binary (via the cache) needed libpcre.so.3, which Ubuntu
          # 26.x no longer ships. Pin the registry's latest 2.22 build, which
          # links only against libc/libstdc++, and sync its package.json
          # version so the platform's tool check does not wipe it mid-check
          # (mechanism documented in bin/cppcheck-tool-sync).
          ./bin/cppcheck-tool-sync

      - name: Report cppcheck version
        # Informational only: prove in the CI log that the resolved tool is
        # the PCRE-free 2.22 build, not a stale cached 2.20 binary.
        run: |
          bin="${HOME}/.platformio/packages/tool-cppcheck/cppcheck"
          if [[ -x "${bin}" ]]; then
            "${bin}" --version
          else
            find "${HOME}/.platformio/packages/tool-cppcheck" -maxdepth 1 -type f -name 'cppcheck*' -print || true
          fi

      - name: Run cppcheck
        run: pio check -e cppcheck --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Short board-specific names keep pull-request artifacts easy to identify.
        # The release workflow publishes xerif-<version>-<device>.bin (plus
        # xpoint-* compatibility assets for pre-rename OTA devices).
        include:
          - env: default
            asset: firmware.bin
          - env: sticky
            asset: firmware-sticky.bin
          - env: x4pro
            asset: firmware-x4pro.bin
          - env: x4c
            asset: firmware-x4c.bin
          - env: papermono
            asset: firmware-papermono.bin
          - env: metalio_eink4
            asset: firmware-metalio_eink4.bin
          - env: eego_a4
            asset: firmware-eego_a4.bin
          - env: picco
            asset: firmware-picco.bin
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.2.0.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-v3-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}
          restore-keys: |
            pio-v3-${{ runner.os }}-${{ matrix.env }}-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # Envs with custom_sdkconfig (default, sticky) run a nested `pio run` from
          # ~/.platformio/penv. The platform bootstraps that penv with an open-ended
          # "pioarduino>=6.1.19", which drifts upward independently of the outer
          # core; a penv core whose tool-scons pin disagrees with the platform's
          # makes them reinstall over each other until the running SCons loses its
          # package mid-build ("No module named 'SCons.Tool.FortranCommon'").
          # Keep the penv core on the same 6.2.0 version as the outer core
          # installed above (the develop platform needs 6.2.0 / SCons 4.11.1 --
          # upstream's 55.03.311 wants 6.1.19, hence the different pin).
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e ${{ matrix.env }}
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.2.0"
          ~/.platformio/penv/bin/pio --version

      - name: Build ${{ matrix.env }} firmware
        run: |
          set -euo pipefail
          pio run -e ${{ matrix.env }} | tee pio.log

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          ram_line="$(grep -E "RAM:\s" -m1 pio.log || true)"
          flash_line="$(grep -E "Flash:\s" -m1 pio.log || true)"
          echo "ram_line=${ram_line}" >> "$GITHUB_OUTPUT"
          echo "flash_line=${flash_line}" >> "$GITHUB_OUTPUT"
          {
            echo "## ${{ matrix.env }} firmware build stats"
            if [ -n "$ram_line" ]; then echo "- ${ram_line}"; else echo "- RAM: not found"; fi
            if [ -n "$flash_line" ]; then echo "- ${flash_line}"; else echo "- Flash: not found"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
          if-no-files-found: error
          # Test builds only — the per-PR firmware-links comment is the
          # delivery path; keep storage bounded.
          retention-days: 7

  unit-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev

      - name: Cache googletest source (FetchContent)
        uses: actions/cache@v6
        with:
          path: build/test/_deps
          # Include the repo name so a rename/fork (which changes the runner
          # checkout path baked into CMakeCache.txt) busts the stale cache
          # instead of restoring a pre-rename one with wrong absolute paths.
          key: ${{ runner.os }}-gtest-${{ github.event.repository.name }}-${{ hashFiles('test/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-gtest-${{ github.event.repository.name }}-

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j"$(nproc)"

  # This job is the single PR required status check. It allows changing the
  # individual jobs above in the future without reconfiguring branch protection.
  ci:
    name: CI Status
    needs:
      - build
      - clang-format
      - cppcheck
      - unit-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
