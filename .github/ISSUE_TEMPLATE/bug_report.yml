name: Bug Report
description: Report an issue or unexpected behavior
title: "Short, descriptive title of the issue"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please fill out the details below.

  - type: dropdown
    id: device
    attributes:
      label: Device
      description: Which device does this happen on? Pick "Other" for boards CrossPoint does not release firmware for — those are maintained in their own port repositories.
      options:
        - Xteink X3
        - Xteink X4
        - Xteink X4 Classic
        - Xteink X4 Pro
        - Seeed Sticky
        - M5Stack Paper Mono
        - Other / not listed
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Affected Version
      description: What version of the project/library are you using? (e.g., v1.2.3, master branch commit SHA)
      placeholder: Ex. v1.2.3
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder:
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Clearly list the steps necessary to reproduce the unexpected behavior.
      placeholder: |
        1. Go to '...'
        2. Select '...'
        3. Crash
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output/Screenshots
      description: |
        If applicable, paste error messages or log output, or drag and drop screenshots here. Both capture methods are explained in the [troubleshooting guide](https://xerif.aaflalo.me/docs/troubleshooting#providing-logs-for-a-bug-report):

        - **SD Debug Log:** Settings → System → SD Debug Log on → reproduce → back off → Logs tab **Download**, or copy `.crosspoint/log.txt` via USB Drive.
        - **Serial:** from a repository clone, run `uv run scripts/debugging_monitor.py` and paste the console output.
      render: shell
